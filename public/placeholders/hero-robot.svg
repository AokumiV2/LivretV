<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Silhouette de robot humanoïde">
  <defs>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22242f"/>
      <stop offset="0.45" stop-color="#131520"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#5ee0ff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#5ee0ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5ee0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5ee0ff" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#1a2fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1a2fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0.72" x2="0" y2="1">
      <stop offset="0" stop-color="#08080c" stop-opacity="0"/>
      <stop offset="1" stop-color="#08080c" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="none"/>
  <ellipse cx="470" cy="400" rx="430" ry="440" fill="url(#halo)"/>

  <!-- Épaules et torse -->
  <path d="M232 1200 C238 900 292 742 396 668 L560 662 C676 726 726 892 736 1200 Z" fill="url(#body)"/>
  <path d="M396 668 C300 744 250 900 240 1200 L268 1200 C280 908 328 764 414 690 Z" fill="url(#rim)"/>

  <!-- Cou -->
  <path d="M424 616 L556 610 L560 682 L420 688 Z" fill="#0e1018"/>

  <!-- Tête, casque incliné -->
  <path d="M366 236 C438 174 566 168 634 232 C690 286 700 372 674 456 C650 534 588 596 508 614 C438 630 380 600 356 540 C326 466 322 322 366 236 Z" fill="url(#body)"/>
  <path d="M366 236 C438 174 566 168 634 232 C652 250 666 274 674 302 C640 250 570 214 494 216 C430 218 384 240 356 276 C352 260 358 246 366 236 Z" fill="url(#rim)"/>

  <!-- Visière -->
  <path d="M400 330 C450 292 560 288 624 320 C630 366 612 414 578 442 C528 482 452 480 418 442 C394 414 390 366 400 330 Z" fill="url(#visor)" opacity="0.5"/>
  <path d="M406 336 C456 300 556 296 616 326 C620 360 606 398 578 422 C534 458 464 456 434 422 C412 396 400 366 406 336 Z" fill="#0a0c14"/>

  <!-- Nervures du casque -->
  <g stroke="#5ee0ff" stroke-opacity="0.22" fill="none" stroke-width="2">
    <path d="M380 268 C450 226 570 224 646 268"/>
    <path d="M372 300 C446 254 574 252 660 300"/>
    <path d="M418 470 C476 502 552 498 594 466"/>
  </g>

  <!-- Lignes techniques du torse -->
  <g stroke="#5ee0ff" stroke-opacity="0.16" fill="none" stroke-width="1.5">
    <path d="M330 820 C420 782 560 780 660 818"/>
    <path d="M310 900 C412 858 574 856 686 898"/>
    <path d="M298 986 C408 940 582 938 700 984"/>
  </g>

  <!-- Points lumineux -->
  <circle cx="604" cy="352" r="4" fill="#5ee0ff" opacity="0.8"/>
  <circle cx="352" cy="856" r="3" fill="#1a2fff" opacity="0.9"/>
  <circle cx="672" cy="932" r="3" fill="#5ee0ff" opacity="0.5"/>

  <rect y="820" width="900" height="380" fill="url(#fade)"/>
</svg>
